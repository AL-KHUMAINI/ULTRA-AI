name: Build ULTRA AI Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip autoconf libtool pkg-config zlib1g-dev libltdl-dev gfortran

    - name: Install Buildozer & Cython
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Inject GEMINI_API_KEY into .env
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        echo "GEMINI_API_KEY=${GEMINI_API_KEY}" > .env

    - name: Build Debug APK with Buildozer
      run: |
        buildozer android debug

    - name: Upload Universal APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ULTRA-AI-Universal-APK
        path: bin/*.apk
